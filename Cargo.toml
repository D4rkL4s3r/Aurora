[package]
name = "aurora"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
open = "5"
trash = "5"
egui_extras = "0.35"
walkdir = "2"
chrono = "0.4"
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }
